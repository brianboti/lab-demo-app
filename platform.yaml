api_version: lab/v1
name: lab-demo
runtime: python-http
port: 8080
health_path: /health
resources:
  cpu: 1
  memory_mib: 512
scaling:
  minimum: 0
  maximum: 2
# Requests served in parallel by one instance; higher values need fewer instances and cost less when the app can handle it.
concurrency: 80
# Plain configuration set on every revision; secrets would be listed under `secrets` as Secret Manager names.
env:
  GREETING: hello from Lab Deploy 0.8.0
timeout_seconds: 120
# What the app needs besides its container; the platform provisions them and sets BUCKET_UPLOADS, TOPIC_EVENTS,
# SUBSCRIPTION_EVENTS and FIRESTORE_DATABASE on every revision (docs/SETUP.md 6b in the platform repository).
needs:
  buckets: [uploads]
  topics: [events]
  database: none              # the demo stores nothing; firestore and postgres were exercised on 2026-10-12
exposure: authenticated
state: stateless
dependencies: []
gpu: false
# This example app has been inspected; generated configs default to false.
reviewed: true

