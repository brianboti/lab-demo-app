name: Debug OIDC claims
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  claims:
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Print the identity token claims (not the token)
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=debug" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for key in ("sub", "ref", "ref_type", "repository", "repository_id", "repository_owner", "repository_owner_id", "workflow_ref", "job_workflow_ref", "environment", "event_name", "aud"):
              print(f"{key} = {claims.get(key)!r} ({type(claims.get(key)).__name__})")
          PY
